# O nginx serve os arquivos da tela e repassa as rotas da API para o serviço
# "backend" do compose. Tela e API no mesmo endereço: o cookie de sessão
# funciona sem CORS.
server {
  listen 80;

  root /usr/share/nginx/html;

  # A tela é uma página só: qualquer caminho que não é arquivo abre o index.
  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    proxy_pass http://backend:3001;
  }

  location = /health {
    proxy_pass http://backend:3001;
  }

  location /inscricoes {
    proxy_pass http://backend:3001;
  }

  location /admin/ {
    proxy_pass http://backend:3001;
  }
}
